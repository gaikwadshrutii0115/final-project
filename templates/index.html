<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog CRUD</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container py-5">
      <div class="row">
        <div class="col-lg-7 col-md-9 mx-auto">
          <div class="card shadow-sm">
            <div class="card-header fw-semibold">Add Post</div>
            <div class="card-body">
              <form id="postForm">
                <div>
                  <label for="title" class="form-label">Title</label>
                  <input
                    type="text"
                    class="form-control"
                    id="title"
                    placeholder="Enter post title"
                    required
                  />
                </div>
                <div class="mt-2">
                  <label for="desc" class="form-label">Description</label>
                  <textarea
                    class="form-control"
                    id="desc"
                    rows="3"
                    placeholder="Enter post description"
                  ></textarea>
                </div>
                <div class="mt-2">
                  <label for="hero" class="form-label">Image URL</label>
                  <input
                    type="url"
                    class="form-control"
                    id="hero"
                    placeholder="https://example.com/image.jpg"
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">
                  Add Post
                </button>
              </form>
            </div>
          </div>

          <div
            class="d-flex justify-content-between align-items-center mt-4 mb-2"
          >
            <h1 class="h5 mb-0">Posts</h1>
            <span id="postCount" class="badge bg-secondary">0</span>
          </div>

          <div id="alertBox"></div>
          <div id="postList"></div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title text-danger">Delete Post</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p class="text-muted text-center mb-4">
              Are you sure you want to delete this post?
            </p>
            <input type="hidden" id="deleteId" />
            <div class="btn-group w-100">
              <button
                type="button"
                class="btn btn-outline-danger"
                id="confirmDeleteBtn"
              >
                Yes
              </button>
              <button
                type="button"
                class="btn btn-success"
                data-bs-dismiss="modal"
              >
                No
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const postForm = document.getElementById("postForm");
      const postList = document.getElementById("postList");
      const postCount = document.getElementById("postCount");
      const alertBox = document.getElementById("alertBox");
      const deleteModal = new bootstrap.Modal(
        document.getElementById("deleteModal"),
      );

      let posts = [];

      function showAlert(message, type = "success") {
        alertBox.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
      }

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value || "";
        return div.innerHTML;
      }

      function renderPosts() {
        postCount.textContent = posts.length;

        if (!posts.length) {
          postList.innerHTML =
            '<div class="alert alert-info">No posts yet. Add your first post above.</div>';
          return;
        }

        postList.innerHTML = posts
          .map(
            (post) => `
                <div class="card mt-3 shadow-sm">
                    ${post.hero ? `<img src="${escapeHtml(post.hero)}" class="card-img-top" alt="${escapeHtml(post.title)}" style="max-height: 200px; object-fit: cover;">` : ""}
                    <div class="card-header d-flex justify-content-between align-items-center gap-2">
                        <span class="fw-semibold text-dark">${escapeHtml(post.title)}</span>
                        <button type="button" class="btn btn-sm btn-danger" onclick="openDelete(${post.id})">
                            Delete
                        </button>
                    </div>
                    <div class="card-body">
                        ${post.desc ? escapeHtml(post.desc) : '<span class="text-muted">No description</span>'}
                    </div>
                </div>
            `,
          )
          .join("");
      }

      async function fetchPosts() {
        try {
          const response = await fetch("/posts");
          if (!response.ok) throw new Error("Failed to load posts");
          posts = await response.json();
          renderPosts();
        } catch (error) {
          showAlert(error.message, "danger");
        }
      }

      async function savePost(url, method, payload) {
        const response = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.message || "Something went wrong");
        }

        return response.json();
      }

      postForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        try {
          await savePost("/posts", "POST", {
            title: document.getElementById("title").value,
            desc: document.getElementById("desc").value,
            hero: document.getElementById("hero").value,
          });
          postForm.reset();
          showAlert("Post added successfully");
          fetchPosts();
        } catch (error) {
          showAlert(error.message, "danger");
        }
      });

      function openDelete(id) {
        document.getElementById("deleteId").value = id;
        deleteModal.show();
      }

      document
        .getElementById("confirmDeleteBtn")
        .addEventListener("click", async () => {
          const id = document.getElementById("deleteId").value;

          try {
            const response = await fetch(`/posts/${id}`, { method: "DELETE" });

            if (!response.ok) {
              const data = await response.json().catch(() => ({}));
              throw new Error(data.message || "Something went wrong");
            }

            deleteModal.hide();
            showAlert("Post deleted successfully");
            fetchPosts();
          } catch (error) {
            showAlert(error.message, "danger");
          }
        });

      fetchPosts();
    </script>
  </body>
</html>
